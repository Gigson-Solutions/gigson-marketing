name: Deploy integrations subdomain

on:
  push:
    branches:
      - landing-con-chatbot-Holded
  workflow_dispatch:

env:
  INTEGRATIONS_BUCKET: integrations-gigsonsolutions-com
  INTEGRATIONS_DISTRIBUTION_ID: E2G6L55TMHDDJQ

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AWS
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Sync to S3 (integrations)
        run: aws s3 sync dist/ "s3://${INTEGRATIONS_BUCKET}/" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${INTEGRATIONS_DISTRIBUTION_ID}" --paths "/*"
